<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato — Meu Portfólio</title>
    <link rel="stylesheet" href="CSS/estilos.css">
</head>
<body>

    <header>
        <h1>Nathan Gabriel Santos</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="curriculo.html">Currículo</a>
            <a href="formulario.html">Contato</a>
            <a href="multimidia.html">Multimídia</a>
            <a href="graficos.html">Gráficos</a>
        </nav>
    </header>

    <main>
        <section class="card">
            <h2>Formulário de Contato</h2>
            <form action="#" method="post">
                <div class="campo">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="seuemail@exemplo.com">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone (opcional):</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999">
                </div>

                <div class="campo">
                    <label for="data_contato">Data preferida para retorno:</label>
                    <input type="date" id="data_contato" name="data_contato">
                </div>

                <div class="campo">
                    <label for="assunto">Assunto:</label>
                    <select id="assunto" name="assunto" required>
                        <option value="">Selecione um assunto</option>
                        <option value="orcamento">Proposta / Oportunidade</option>
                        <option value="duvida">Dúvida</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Preferência de Resposta:</label>
                    <div class="campo-grupo">
                        <label><input type="radio" name="preferencia" value="email" checked> E-mail</label>
                        <label><input type="radio" name="preferencia" value="whatsapp"> WhatsApp</label>
                    </div>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="5" required placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>

                <div class="campo-grupo">
                    <label><input type="checkbox" id="newsletter" name="newsletter" value="sim"> Desejo receber atualizações por e-mail</label>
                </div>

                <button type="submit">Enviar Mensagem</button>
            </form>
        </section>
    </main>

     <footer>
        <p>&copy; 2026 — Nathan Gabriel Nunes dos Santos. Projeto acadêmico de Desenvolvimento Front-End para Web.</p>
    </footer>

</body>
</html>
