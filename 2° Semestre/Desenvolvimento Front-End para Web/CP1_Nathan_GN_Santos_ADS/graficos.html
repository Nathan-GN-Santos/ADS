    <main>
        <section class="card">
            <h2>Desenho com Canvas (JavaScript)</h2>
            <canvas id="meuCanvas" width="400" height="150" style="border:1px solid #dce4dd;"></canvas>
            <script>
                const canvas = document.getElementById('meuCanvas');
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#2e6f40';
                ctx.fillRect(20, 20, 100, 100);
                ctx.fillStyle = '#1e2923';
                ctx.font = '16px Montserrat, sans-serif';
                ctx.fillText('Canvas OK!', 140, 75);
            </script>
        </section>

        <section class="card">
            <h2>Ilustração em SVG Estilizado via CSS</h2>
            <svg class="svg-demo" width="120" height="120" viewBox="0 0 24 24" aria-label="Ícone Decorativo de Estrela">
